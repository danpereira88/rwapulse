<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWA Pulse · local data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1a14; --panel: #12241c; --panel2: #173025; --line: #24402f;
    --text: #e6efe9; --muted: #8fa89a; --teal: #3fc1b0; --gold: #d8b45a;
    --up: #5fd09a; --down: #e57b6b;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; }
  a { color: var(--teal); }
  nav { width: 230px; flex: none; border-right: 1px solid var(--line); padding: 20px 0; overflow-y: auto; background: #0a1611; }
  nav .brand { font-family: var(--serif); font-size: 22px; padding: 0 20px 4px; }
  nav .brand span { color: var(--gold); }
  nav .sub { color: var(--muted); font-size: 12px; padding: 0 20px 16px; }
  nav h4 { margin: 18px 20px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    padding: 6px 20px; font: inherit; cursor: pointer; border-left: 2px solid transparent; }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--panel); border-left-color: var(--teal); color: #fff; }
  nav button small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  main { flex: 1; overflow-y: auto; padding: 28px 36px 60px; min-width: 0; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0 0 4px; }
  .desc { color: var(--muted); margin: 0 0 20px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-family: var(--mono); font-size: 24px; margin-top: 4px; }
  .kpi .note { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
  .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .card h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel2); cursor: pointer; white-space: nowrap; user-select: none; }
  th.sorted { color: var(--teal); }
  td { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody tr:hover { background: var(--panel2); }
  tr.clickable { cursor: pointer; }
  .tablewrap { overflow: auto; max-height: 64vh; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--teal); }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 7px 12px; cursor: pointer; font: inherit; text-decoration: none; }
  .btn:hover { border-color: var(--teal); }
  .btn.primary { background: var(--teal); color: #06231d; border-color: var(--teal); font-weight: 600; }
  .pager { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: auto; display: flex; gap: 8px; align-items: center; }
  textarea { width: 100%; min-height: 140px; font-family: var(--mono); font-size: 13px; }
  .err { color: var(--down); font-family: var(--mono); white-space: pre-wrap; margin: 10px 0; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .axis { fill: var(--muted); font: 10px var(--mono); }
  .chart .grid { stroke: var(--line); }
  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .bar .lbl { width: 150px; flex: none; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { flex: 1; height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--teal); }
  .bar .v { width: 80px; text-align: right; font-family: var(--mono); }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  .pill.stale { color: var(--gold); border-color: #5a4a22; }
  .detail { margin-bottom: 16px; }
  .muted { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 8px 0; }
  .lede { font-family: var(--serif); font-size: 21px; line-height: 1.35; max-width: 760px; margin: 0 0 10px; color: #f3f7f4; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .banner { border: 1px solid #5a4a22; background: #1d1a0f; color: #e8dcb6; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 0 0 18px; max-width: 980px; }
  .pill.src-gold { color: var(--gold); border-color: #5a4a22; } .pill.src-teal { color: var(--teal); border-color: #1f5a52; } .pill.src-red { color: var(--down); border-color: #5a2a22; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .pcard .kind { font-family: var(--mono); font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
  .pcard .nm { font-family: var(--serif); font-size: 20px; } .pcard .par { color: var(--muted); font-size: 12px; }
  .pcard .val { font-family: var(--mono); font-size: 22px; margin-top: 6px; } .pcard .blurb { color: #c9d6ce; font-size: 13px; }
  .watch { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .watch .wid { font-family: var(--mono); color: var(--gold); font-size: 12px; } .watch h2 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 4px 0 6px; }
  .status { font-family: var(--mono); font-size: 12px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--line); }
  .status.on { color: var(--down); border-color: #5a2a22; } .status.off { color: var(--up); border-color: #1f5a3a; }
  .section { margin: 26px 0 8px; } .section h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .stat-row { display: flex; gap: 26px; flex-wrap: wrap; margin: 8px 0 14px; } .stat-row div { font-family: var(--mono); } .stat-row small { display: block; color: var(--muted); font-family: var(--sans); font-size: 12px; }
  code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<nav id="nav">
  <div class="brand">RWA <span>Pulse</span></div>
  <div class="sub" id="dbstamp">local · rwa.duckdb</div>
</nav>
<main id="main"><p class="muted">Loading…</p></main>

<script>
const VIEW_GROUPS = [
  ["Market", [["protocols","Protocols"],["tokens","Tracked tokens"],["categories","CoinGecko categories"],["stablecoins","Stablecoins"]]],
  ["Credit & yield", [["maple","Maple pools"],["centrifuge","Centrifuge assets"],["yields","Yield pools"],["fees","Fees & revenue"]]],
  ["On-chain", [["supply","Token supply"],["flows","Mint / burn flows"]]],
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// On the static (Vercel) build, read pre-exported JSON instead of the local server
const STATIC = !!window.STATIC_SITE;
function staticPath(path) {
  const u = new URL(path, location.origin), p = u.pathname;
  if (p.startsWith("/api/page/")) return `data/page-${p.slice(10)}.json`;
  if (p === "/api/overview") return "data/overview.json";
  if (p === "/api/view") return `data/view-${u.searchParams.get("name")}.json`;
  return null;
}
const api = async (path, opts) => {
  if (STATIC) {
    const sp = staticPath(path);
    if (!sp) throw new Error("This view needs the local data server (ui/app.py).");
    path = sp;
  }
  const r = await fetch(path, opts); const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText); return j;
};

// ── formatting ──
const isUsd = c => /(_usd$|^tvl|tvl$|mcap|market_cap|fdv|total_assets|principal_out|liquidity_cap|value_usd|total_circulating|net_flow|total_minted|total_burned|unrealized)/i.test(c) && !/pct|rank/i.test(c);
const isPct = c => /(_pct|pct_|^change_|^apy)/i.test(c);
function compact(n, usd) {
  if (n == null || n === "") return "—";
  const a = Math.abs(n), s = usd ? "$" : "";
  if (a >= 1e12) return s + (n/1e12).toFixed(2) + "T";
  if (a >= 1e9) return s + (n/1e9).toFixed(2) + "B";
  if (a >= 1e6) return s + (n/1e6).toFixed(2) + "M";
  if (a >= 1e3) return s + (n/1e3).toFixed(1) + "K";
  return s + (Number.isInteger(n) ? n : n.toFixed(a < 1 ? 4 : 2));
}
const pct = (n, signed=true) => n == null ? "—" : `<span class="${n>0?"up":n<0?"down":""}">${signed && n>0?"+":""}${n.toFixed(2)}%</span>`;
function cell(col, v) {
  if (v == null) return `<td class="muted">—</td>`;
  if (typeof v === "number") {
    if (isPct(col)) return `<td class="num">${pct(v)}</td>`;
    if (isUsd(col)) return `<td class="num" title="${v}">${compact(v, true)}</td>`;
    return `<td class="num" title="${v}">${/year|block|decimals|_id$|^id$/i.test(col) ? v : compact(v)}</td>`;
  }
  if (typeof v === "boolean") return `<td>${v ? "yes" : "no"}</td>`;
  if (typeof v === "object") v = JSON.stringify(v);
  const s = String(v);
  if (/^https?:\/\//.test(s)) return `<td><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//,""))}</a></td>`;
  return `<td title="${esc(s)}">${esc(s)}</td>`;
}

// ── charts (plain SVG) ──
function lineChart(points, {height=220, color="var(--teal)", usd=true} = {}) {
  const pts = points.filter(p => p[1] != null);
  if (pts.length < 2) return `<p class="muted">Not enough data to chart.</p>`;
  const W = 760, H = height, L = 58, R = 12, T = 10, B = 24;
  const xs = pts.map(p => new Date(p[0]).getTime()), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), yMax = Math.max(...ys) * 1.05, yMin = Math.min(0, Math.min(...ys));
  const X = t => L + (t - x0) / (x1 - x0 || 1) * (W - L - R);
  const Y = v => T + (1 - (v - yMin) / (yMax - yMin || 1)) * (H - T - B);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * i / 4, y = Y(v);
    grid += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis" x="${L-6}" y="${y+3}" text-anchor="end">${compact(v, usd)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const t = x0 + (x1 - x0) * i / 4;
    grid += `<text class="axis" x="${X(t)}" y="${H-6}" text-anchor="middle">${new Date(t).toISOString().slice(0, 7)}</text>`;
  }
  const area = d + `L${X(xs.at(-1))},${Y(yMin)}L${X(xs[0])},${Y(yMin)}Z`;
  const id = "g" + Math.random().toString(36).slice(2);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" data-x0="${x0}" data-x1="${x1}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/>
    <circle cx="${X(xs.at(-1))}" cy="${Y(ys.at(-1))}" r="3" fill="${color}"/></svg>
    <div class="muted" style="font-size:12px;font-family:var(--mono)">${pts[0][0]} → ${pts.at(-1)[0]} · latest ${compact(ys.at(-1), usd)}</div></div>`;
}
// Multi-series line chart. series: [{name, color, points:[[date, v]], dash}]
function multiLine(series, {height=240, fmt=v => compact(v, true), yMin0=true, marker=null} = {}) {
  const all = series.flatMap(s => s.points.filter(p => p[1] != null));
  if (all.length < 2) return `<p class="muted">Not enough data to chart.</p>`;
  const W = 760, H = height, L = 58, R = 12, T = 10, B = 24;
  const xs = all.map(p => new Date(p[0]).getTime()), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let yMax = Math.max(...ys), yMin = yMin0 ? Math.min(0, ...ys) : Math.min(...ys);
  const pad = (yMax - yMin) * 0.08 || 1; yMax += pad; if (!yMin0) yMin -= pad;
  const X = t => L + (t - x0) / (x1 - x0 || 1) * (W - L - R);
  const Y = v => T + (1 - (v - yMin) / (yMax - yMin || 1)) * (H - T - B);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = yMin + (yMax - yMin) * i / 4, y = Y(v);
    g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis" x="${L-6}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const t = x0 + (x1 - x0) * i / 4;
    g += `<text class="axis" x="${X(t)}" y="${H-6}" text-anchor="middle">${new Date(t).toISOString().slice(0, 10)}</text>`; }
  if (marker) { const mx = X(new Date(marker.date).getTime());
    g += `<line x1="${mx}" x2="${mx}" y1="${T}" y2="${H-B}" stroke="var(--down)" stroke-dasharray="3,3" opacity=".7"/><text class="axis" x="${mx+4}" y="${T+10}" style="fill:var(--down)">${esc(marker.label)}</text>`; }
  if (marker && marker.hline != null) { const y = Y(marker.hline);
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--gold)" stroke-dasharray="4,4" opacity=".8"/>`; }
  const paths = series.map(s => { const p = s.points.filter(q => q[1] != null);
    const d = p.map((q, i) => (i ? "L" : "M") + X(new Date(q[0]).getTime()).toFixed(1) + "," + Y(q[1]).toFixed(1)).join("");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" ${s.dash ? 'stroke-dasharray="5,4"' : ""}/>`; }).join("");
  const legend = series.map(s => `<span style="margin-right:14px"><span style="display:inline-block;width:14px;height:2px;background:${s.color};vertical-align:middle;margin-right:5px;${s.dash?"opacity:.7":""}"></span>${esc(s.name)}</span>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${paths}</svg><div class="muted" style="font-size:12px">${legend}</div></div>`;
}
function spark(points, color="var(--teal)") {
  const p = points.filter(q => q[1] != null); if (p.length < 2) return "";
  const W = 220, H = 48, xs = p.map(q => new Date(q[0]).getTime()), ys = p.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const d = p.map((q, i) => (i ? "L" : "M") + ((xs[i]-x0)/(x1-x0||1)*W).toFixed(1) + "," + (H-2-(q[1]-y0)/(y1-y0||1)*(H-4)).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:48px"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}
const SRC = { "defillama": ["DefiLlama", ""], "onchain": ["On-chain supply × price", "teal"],"coingecko": ["CoinGecko market cap", "gold"], "centrifuge subgraph": ["Centrifuge subgraph", "teal"],
              "missing": ["not reported", "red"], "mixed": ["multiple sources", ""], "defillama → centrifuge subgraph": ["DefiLlama → subgraph", "teal"] };
const srcPill = (s, disputed) => { const [l, c] = SRC[s] || [s, ""];
  return `<span class="pill src-${c}">${esc(l)}</span>` + (disputed ? ` <span class="pill src-red" title="DefiLlama and the token's market cap differ by more than 50%">sources disagree</span>` : ""); };
function coverageNote(cov, date, notes) {
  const p = cov.pct || {}, f = k => (p[k] || 0).toFixed(0) + "%";
  return `<div class="banner"><b>How this is measured.</b> Asset by asset, grouped by issuer — the way DefiLlama's RWA dashboard now counts.
    Of the ${compact(cov.total, true)} on ${esc(date)}: ${f("onchain")} read on-chain (token supply × price, chain by chain), ${f("coingecko")} CoinGecko market cap,
    ${f("defillama")} DefiLlama protocol TVL (issuers with no token, e.g. Maple).${cov.missing ? ` Assets with no source this week (last seen at ${compact(cov.missing, true)}) are left out.` : ""}
    ${(notes || []).map(n => `<br><span class="muted">${esc(n)}</span>`).join("")}</div>`;
}
const lede = (t, sub) => `<p class="lede">${t}</p>${sub ? `<p class="desc">${sub}</p>` : ""}`;

function bars(items, usd=true) {
  const max = Math.max(...items.map(i => i[1] || 0)) || 1;
  return items.map(([l, v]) => `<div class="bar"><div class="lbl" title="${esc(l)}">${esc(l)}</div><div class="track"><div class="fill" style="width:${(v||0)/max*100}%"></div></div><div class="v">${compact(v, usd)}</div></div>`).join("");
}

// ── navigation ──
let TABLES = [];
function buildNav(tables) {
  const nav = $("#nav");
  const add = (html) => nav.insertAdjacentHTML("beforeend", html);
  add(`<h4>RWA Intel</h4>` + [["overview","Overview"],["concentration","Concentration"],["roster","New Roster"],
       ["didnt-happen","What Didn't Happen"],["reference","Reference"],["watching","What We're Watching"]]
       .map(([k, l]) => `<button data-r="${k}">${l}</button>`).join(""));
  add(`<h4>Data</h4><button data-r="health">Data health</button>`);
  if (STATIC) {
    nav.addEventListener("click", e => { const b = e.target.closest("button[data-r]"); if (b) location.hash = b.dataset.r; });
    return;
  }
  for (const [g, items] of VIEW_GROUPS) {
    add(`<h4>${g}</h4>` + items.map(([k, l]) => `<button data-r="view/${k}">${l}</button>`).join(""));
  }
  add(`<h4>All tables (${tables.length})</h4>` + tables.map(t => `<button data-r="table/${t.name}">${t.name}<small>${compact(t.rows)}</small></button>`).join(""));
  add(`<h4>Query</h4><button data-r="sql">SQL console</button>`);
  nav.addEventListener("click", e => { const b = e.target.closest("button[data-r]"); if (b) location.hash = b.dataset.r; });
}
function route() {
  const r = location.hash.slice(1) || "overview";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.r === r));
  const [kind, name] = r.split("/");
  const m = $("#main");
  m.scrollTop = 0;
  const pages = { overview: pOverview, concentration: pConcentration, roster: pRoster,
                  "didnt-happen": pDidnt, reference: pReference, watching: pWatching, health: overview };
  if (pages[kind]) return load(m, pages[kind]);
  if (kind === "view") return grid(m, "view", name);
  if (kind === "table") return grid(m, "table", name);
  if (kind === "sql") return sqlConsole(m);
}
async function load(m, fn) {
  m.innerHTML = `<p class="muted">Loading…</p>`;
  try { await fn(m); } catch (e) { m.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
const pctFmt = v => v.toFixed(0) + "%";
const protoTable = (rows, {share=true} = {}) => `<table><thead><tr><th>#</th><th>Issuer</th><th>Asset class</th><th>Main chain</th><th class="num">TVL</th>${share?'<th class="num">Share</th>':""}<th>Source</th></tr></thead><tbody>

// ── generic grid for views & tables ──
async function grid(m, kind, name) {
  const st = { q: "", sort: "", dir: "desc", offset: 0, limit: 100, snapshot: "" };
  const meta = kind === "table" ? TABLES.find(t => t.name === name) : null;
  const seriesKind = kind === "view" && name === "protocols" ? ["protocol", "slug"] : kind === "view" && name === "stablecoins" ? ["stablecoin", "id"] : null;
  m.innerHTML = `<h1 id="gtitle">${esc(name)}</h1><p class="desc" id="gdesc"></p>
    <div class="detail" id="gdetail"></div>
    <div class="toolbar">
      <input id="gq" placeholder="Search all columns…" style="width:260px">
      ${meta && meta.snapshots.length ? `<select id="gsnap"><option value="">All snapshots (${meta.snapshots.length})</option>${meta.snapshots.map(s => `<option>${esc(s)}</option>`).join("")}</select>` : ""}
      <a class="btn" id="gcsv">Download CSV</a>
      <div class="pager"><span id="gcount"></span><button class="btn" id="gprev">‹</button><button class="btn" id="gnext">›</button></div>
    </div>
    <div class="tablewrap"><table id="gtable"></table></div>
    <details><summary>Query</summary><code id="gsql"></code></details>`;
  const load = async () => {
    const p = new URLSearchParams({ name, q: st.q, sort: st.sort, dir: st.dir, offset: st.offset, limit: st.limit, snapshot: st.snapshot });
    let r; try { r = await api(`/api/${kind}?${p}`); } catch (e) { $("#gtable").innerHTML = `<tr><td class="err">${esc(e.message)}</td></tr>`; return; }
    if (r.title) { $("#gtitle").textContent = r.title; $("#gdesc").textContent = r.description; $("#gsql").textContent = r.sql; }
    else { $("#gdesc").textContent = `Raw table · ${compact(meta?.rows)} rows · ${meta?.columns.length} columns`; $("#gsql").textContent = `SELECT * FROM ${name}`; }
    const keyIdx = seriesKind ? r.columns.indexOf(seriesKind[1]) : -1;
    $("#gtable").innerHTML = `<thead><tr>${r.columns.map(c => `<th data-c="${esc(c)}" class="${st.sort===c?"sorted":""} ${typeof r.rows[0]?.[r.columns.indexOf(c)]==="number"?"num":""}">${esc(c)}${st.sort===c?(st.dir==="desc"?" ↓":" ↑"):""}</th>`).join("")}</tr></thead>
      <tbody>${r.rows.map(row => `<tr class="${keyIdx>=0?"clickable":""}" ${keyIdx>=0?`data-k="${esc(row[keyIdx])}"`:""}>${row.map((v,i) => cell(r.columns[i], v)).join("")}</tr>`).join("") || `<tr><td class="muted">No rows</td></tr>`}</tbody>`;
    $("#gcount").textContent = r.total ? `${st.offset + 1}–${Math.min(st.offset + st.limit, r.total)} of ${r.total.toLocaleString()}` : "0 rows";
    $("#gprev").disabled = st.offset === 0; $("#gnext").disabled = st.offset + st.limit >= r.total;
    $("#gcsv").href = `/api/csv?${new URLSearchParams({ kind, name, q: st.q, sort: st.sort, dir: st.dir, snapshot: st.snapshot })}`;
    m.querySelectorAll("th[data-c]").forEach(th => th.onclick = () => { const c = th.dataset.c; st.dir = st.sort === c && st.dir === "desc" ? "asc" : "desc"; st.sort = c; st.offset = 0; load(); });
    if (seriesKind) m.querySelectorAll("tr[data-k]").forEach(tr => tr.onclick = async () => {
      const s = await api(`/api/series?kind=${seriesKind[0]}&key=${encodeURIComponent(tr.dataset.k)}`);
      $("#gdetail").innerHTML = `<div class="card"><h3>${esc(s.name)} <small>${s.unit} history</small></h3>${lineChart(s.points)}</div>`;
      $("#gdetail").scrollIntoView({ behavior: "smooth" });
    });
  };
  let t; $("#gq").oninput = e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; st.offset = 0; load(); }, 250); };
  if ($("#gsnap")) $("#gsnap").onchange = e => { st.snapshot = e.target.value; st.offset = 0; load(); };
  $("#gprev").onclick = () => { st.offset = Math.max(0, st.offset - st.limit); load(); };
  $("#gnext").onclick = () => { st.offset += st.limit; load(); };
  load();
}

// ── SQL console ──
function sqlConsole(m) {
  const saved = (() => { try { return localStorage.getItem("rwa_sql"); } catch { return null; } })();
  m.innerHTML = `<h1>SQL console</h1><p class="desc">Read-only DuckDB queries against rwa.duckdb. ⌘/Ctrl + Enter to run. Up to 5,000 rows shown.</p>
    <textarea id="sq">${esc(saved || `-- RWA TVL by category across snapshots\nSELECT snapshot_date, category, round(sum(tvl_usd)/1e9, 2) AS tvl_bn\nFROM dl_protocols\nWHERE category IN ('RWA', 'RWA Lending') AND snapshot_date LIKE '20%'\nGROUP BY 1, 2 ORDER BY 1 DESC, 2`)}</textarea>
    <div class="toolbar" style="margin-top:10px"><button class="btn primary" id="srun">Run</button><span class="muted" id="sinfo"></span></div>
    <div id="serr"></div><div class="tablewrap"><table id="stable"></table></div>`;
  const runq = async () => {
    const sql = $("#sq").value; try { localStorage.setItem("rwa_sql", sql); } catch {}
    $("#serr").innerHTML = ""; $("#sinfo").textContent = "Running…"; const t0 = performance.now();
    try {
      const r = await api("/api/sql", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql }) });
      $("#sinfo").textContent = `${r.rows.length.toLocaleString()} rows${r.truncated ? " (truncated)" : ""} · ${Math.round(performance.now() - t0)} ms`;
      $("#stable").innerHTML = `<thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.rows.map(row => `<tr>${row.map((v, i) => cell(r.columns[i], v)).join("")}</tr>`).join("")}</tbody>`;
    } catch (e) { $("#sinfo").textContent = ""; $("#serr").innerHTML = `<div class="err">${esc(e.message)}</div>`; $("#stable").innerHTML = ""; }
  };
  $("#srun").onclick = runq;
  $("#sq").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runq(); } };
}

(async () => {
  try {
    if (STATIC) {
      const meta = await fetch("data/meta.json").then(r => r.json());
      $("#dbstamp").textContent = `snapshot · updated ${meta.exported_at.replace("T", " ").replace("+00:00", " UTC")}`;
    } else {
      TABLES = (await api("/api/tables")).tables;
      $("#dbstamp").textContent = `local · rwa.duckdb · ${TABLES.length} tables`;
    }
  } catch (e) { $("#main").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  buildNav(TABLES);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
